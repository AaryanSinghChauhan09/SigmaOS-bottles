[package]
name = "sigmaos-bottles"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Wine-bottle manager for running Windows applications and games on SigmaOS"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }

[lib]
name = "bottles"
path = "src/lib.rs"
